[package]
name = "pallet-zkghost"
version = "0.1.0"
edition = "2021"
description = "zkGhost pallet: on-chain Groth16 verification with VK governance"
license = "Apache-2.0"

[dependencies]
# FRAME
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
frame-system  = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
sp-std        = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
scale-info    = { version = "2", default-features = false, features = ["derive"] }

# Arkworks (feature-gated)
ark-groth16   = { version = "0.4", default-features = false, optional = true }
ark-bn254     = { version = "0.4", default-features = false, optional = true }
ark-ec        = { version = "0.4", default-features = false, optional = true }
ark-ff        = { version = "0.4", default-features = false, optional = true }
ark-serialize = { version = "0.4", default-features = false, optional = true }
ark-std       = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0" }

[features]
default = ["std"]
std = [
  "frame-support/std",
  "frame-system/std",
  "sp-std/std",
  "scale-info/std",
  # When building with std, allow arkworks to use std if present
  "ark-groth16?/std",
  "ark-bn254?/std",
  "ark-ec?/std",
  "ark-ff?/std",
  "ark-serialize?/std",
  "ark-std?/std",
]

# Enable ZK verification backend
zk-verify = [
  "ark-groth16",
  "ark-bn254",
  "ark-ec",
  "ark-ff",
  "ark-serialize",
  "ark-std",
]

# Benchmarking feature passthrough
runtime-benchmarks = [
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
