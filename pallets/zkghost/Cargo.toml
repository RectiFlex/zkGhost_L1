[package]
name = "pallet-zkghost"
version = "0.1.0"
edition = "2021"
authors = ["zkGhost Contributors"]
license = "Apache-2.0"
description = "FRAME pallet for storing verifying keys and submitting proofs (zkGhost)."

[lib]
name = "pallet_zkghost"
path = "src/lib.rs"
crate-type = ["rlib"]

# NOTE: Uncomment and pin versions when building with Substrate externally.
# [dependencies]
# frame-support = { version = "*", default-features = false }
# frame-system  = { version = "*", default-features = false }
# sp-io         = { version = "*", default-features = false }
# sp-std        = { version = "*", default-features = false }
# parity-scale-codec = { version = "*", default-features = false, features = ["derive"] }
# scale-info         = { version = "*", default-features = false, features = ["derive"] }

[features]
default = ["std"]
std = [
    # "frame-support/std",
    # "frame-system/std",
    # "sp-io/std",
    # "sp-std/std",
    # "parity-scale-codec/std",
    # "scale-info/std",
]

[package.metadata.docs.rs]
all-features = true

# ZK verifier feature flag — keep offline-friendly; enable in external build
[features]
# keep existing std feature entries above
zk-verify = [
    # Enable these when building with network access and Substrate externally:
    # "ark-groth16",
    # "ark-bn254",
    # "ark-serialize",
    # "ark-ff",
]

# [dependencies]
# ark-groth16 = { version = "0.4", default-features = false, optional = true }
# ark-bn254   = { version = "0.4", default-features = false, optional = true }
# ark-serialize = { version = "0.4", default-features = false, optional = true }
# ark-ff      = { version = "0.4", default-features = false, optional = true }
