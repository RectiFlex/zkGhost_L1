[package]
name = "zkghost-runtime"
version = "0.1.0"
edition = "2021"
authors = ["zkGhost Contributors"]
license = "Apache-2.0"
description = "Substrate runtime for zkGhost (pinned to polkadot-sdk v1.11)"

[lib]
name = "zkghost_runtime"
path = "src/lib.rs"
crate-type = ["rlib"]
[dependencies]
frame-system-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
frame-executive = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
frame-support   = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
frame-system    = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
pallet-transaction-payment = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
pallet-sudo     = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
pallet-timestamp= { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
pallet-aura     = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
pallet-grandpa  = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }

sp-api              = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
sp-block-builder    = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
sp-inherents        = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
sp-core             = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }
sp-runtime          = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false }

# Local pallets
pallet-zkghost = { path = "../pallets/zkghost", package = "pallet-zkghost", default-features = false }

# Optional benchmarking dep (gated)
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0", default-features = false, optional = true }

[features]
default = ["std"]
std = [
  "sp-api/std",
  "sp-core/std",
  "sp-runtime/std",
  "sp-block-builder/std",
  "sp-transaction-pool/std",
  "sp-inherents/std",
  "frame-executive/std",
  "frame-support/std",
  "frame-system/std",
  "pallet-balances/std",
  "pallet-transaction-payment/std",
  "pallet-sudo/std",
  "pallet-timestamp/std",
  "pallet-aura/std",
  "pallet-grandpa/std",
  "pallet-zkghost/std",
  "frame-benchmarking?/std",
]
# Enable runtime benchmarking
runtime-benchmarks = [
  "frame-benchmarking",
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
  "pallet-zkghost/runtime-benchmarks",
]

[build-dependencies]
substrate-wasm-builder = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-sdk-v1.11.0" }
